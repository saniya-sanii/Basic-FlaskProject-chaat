{% extends 'base.html' %}
{% set active = "Login" %}

{% block title %}Kitchen Login — Bite Buzz{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card">
            
            <div class="text-center mb-4">
                <span style="font-size: 3rem;">👨‍🍳</span>
                <h2 class="mt-3 font-weight-extrabold" style="font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: -0.5px;">Kitchen Sign In</h2>
                <p class="text-muted">Enter credentials to open the order control deck</p>
            </div>
            
            <form id="loginForm" method="post" action="{{ url_for('login') }}">
                <div class="form-group mb-3">
                    <label for="username" class="font-weight-bold small text-muted text-uppercase" style="letter-spacing: 0.5px;">Username</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text border-right-0 bg-transparent text-muted" style="border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); border-color: #cbd5e1;"><i class="fa-solid fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control border-left-0 py-4" style="border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0; border-color: #cbd5e1; font-weight: 600;" id="username" name="username" >
                    </div>
                </div>
                
                <div class="form-group mb-4">
                    <label for="password" class="font-weight-bold small text-muted text-uppercase" style="letter-spacing: 0.5px;">Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text border-right-0 bg-transparent text-muted" style="border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm); border-color: #cbd5e1;"><i class="fa-solid fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control border-left-0 py-4" style="border-radius: 0 var(--border-radius-sm) var(--border-radius-sm) 0; border-color: #cbd5e1; font-weight: 600;" id="password" name="password" >
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg py-3">
                    Log In to Kitchen <i class="fa-solid fa-right-to-bracket ml-1"></i>
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <span class="badge badge-light p-2 text-muted" style="font-size: 0.8rem; border-radius: 8px;">
                    <i class="fa-solid fa-circle-info mr-1"></i> password must contain <strong>characters</strong> or <strong>numbers.</strong>
                </span>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
